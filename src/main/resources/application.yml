spring:
  application:
    name: youtube-dubbing-bot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # Neon'dan olgan URL'ingizni shu yerga qo‘ying
    url: jdbc:postgresql://ep-royal-pine-attqpkdh-pooler.c-9.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
    username: neondb_owner
    password: npg_V0dhTE5IZvMA
    driver-class-name: org.postgresql.Driver
    hikari:
      # --- Neon cold-start tuning ---
      # Neon serverless can pause when idle; the first connection wakes it up,
      # so we allow a generous connection timeout but keep the pool small to
      # avoid holding many connections open against a serverless instance.
      pool-name: dubbing-pool
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
      connection-timeout: 30000       # 30s: tolerate cold start wake-up
      idle-timeout: 300000            # 5m
      max-lifetime: 600000            # 10m: below Neon's connection cap
      keepalive-time: 120000          # ping to keep at least 1 conn warm
      initialization-fail-timeout: -1 # don't crash app if DB is briefly asleep

  jpa:
    hibernate:
      ddl-auto: validate              # schema owned by Flyway, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Bounded consumers so heavy pipeline runs don't exhaust CPU/RAM.
        concurrency: 1
        max-concurrency: 3
        prefetch: 1
        default-requeue-rejected: false   # send failures to DLQ, don't loop
        retry:
          enabled: true
          initial-interval: 5000
          max-attempts: 3
          multiplier: 2.0

app:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
    bot-username: ${TELEGRAM_BOT_USERNAME}
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  tools:
    yt-dlp-path: ${YT_DLP_PATH:yt-dlp}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    python-path: ${PYTHON_PATH:python3}
    python-dir: ${PYTHON_DIR:python}
    process-timeout-seconds: ${PROCESS_TIMEOUT_SECONDS:1800}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.dubbing.bot: INFO
    org.springframework.amqp: WARN
